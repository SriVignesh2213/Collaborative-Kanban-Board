version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kanban-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePass123!}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban_user} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do NOT expose port 5432 publicly in production

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanban-express-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kanban_user}:${POSTGRES_PASSWORD:-SuperSecurePass123!}@db:5432/${POSTGRES_DB:-kanban}?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    container_name: kanban-nginx-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: